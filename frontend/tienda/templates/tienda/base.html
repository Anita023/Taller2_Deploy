<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TechGear</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            max-width: 1100px;
            margin: 0 auto;
            padding: 20px;
            background: #f4f6f8;
        }

        nav {
            background: #111827;
            padding: 18px;
            margin-bottom: 25px;
        }

        nav a {
            color: white;
            text-decoration: none;
            margin-right: 20px;
        }

        .productos {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 20px;
        }

        .card {
            background: white;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0 2px 8px #0002;
        }

        input, select, button {
            width: 100%;
            padding: 10px;
            margin: 8px 0 15px;
            box-sizing: border-box;
        }

        button {
            background: #2563eb;
            color: white;
            border: 0;
            cursor: pointer;
            border-radius: 5px;
        }

        .mensaje {
            padding: 10px;
            background: #dbeafe;
            margin-bottom: 15px;
        }
    </style>
</head>
<body>
    <nav>
        <a href="{% url 'productos' %}">Catálogo</a>
    </nav>

    {% for message in messages %}
        <div class="mensaje">{{ message }}</div>
    {% endfor %}

    {% block contenido %}
    {% endblock %}
</body>
</html>
