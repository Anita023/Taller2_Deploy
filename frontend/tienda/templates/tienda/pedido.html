<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Crear pedido - TechGear</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            max-width: 900px;
            margin: 0 auto;
            padding: 30px;
            background-color: #f3f4f6;
        }

        nav {
            margin-bottom: 25px;
        }

        nav a {
            color: #2563eb;
            text-decoration: none;
            margin-right: 20px;
        }

        .formulario {
            background: white;
            padding: 25px;
            border-radius: 10px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.12);
        }

        label {
            display: block;
            margin-top: 15px;
            margin-bottom: 5px;
            font-weight: bold;
        }

        input,
        select,
        button {
            width: 100%;
            padding: 11px;
            box-sizing: border-box;
            border-radius: 5px;
            border: 1px solid #d1d5db;
        }

        button {
            margin-top: 20px;
            background-color: #2563eb;
            color: white;
            border: none;
            cursor: pointer;
        }

        button:hover {
            background-color: #1d4ed8;
        }

        .mensaje {
            padding: 12px;
            margin-bottom: 15px;
            border-radius: 5px;
            background-color: #fee2e2;
            color: #991b1b;
        }

        .ayuda {
            color: #4b5563;
            font-size: 14px;
        }
    </style>
</head>
<body>
    <nav>
        <a href="{% url 'productos' %}">Ver catálogo</a>
        <a href="{% url 'crear_pedido' %}">Crear pedido</a>
    </nav>

    <h1>Crear pedido</h1>

    {% for message in messages %}
        <div class="mensaje">
            {{ message }}
        </div>
    {% endfor %}

    <div class="formulario">
        <form method="post">
            {% csrf_token %}

            <label for="cliente_nombre">
                Nombre del cliente
            </label>

            <input
                type="text"
                id="cliente_nombre"
                name="cliente_nombre"
                required
            >

            <label for="cliente_email">
                Correo electrónico
            </label>

            <input
                type="email"
                id="cliente_email"
                name="cliente_email"
                required
            >

            <label for="producto_id">
                Producto
            </label>

            <select
                id="producto_id"
                name="producto_id"
                required
            >
                <option value="">
                    Selecciona un producto
                </option>

                {% for producto in productos %}
                    <option value="{{ producto.id }}">
                        {{ producto.nombre }} -
                        ${{ producto.precio }} -
                        Stock: {{ producto.stock }}
                    </option>
                {% empty %}
                    <option value="">
                        No hay productos disponibles
                    </option>
                {% endfor %}
            </select>

            <label for="cantidad">
                Cantidad
            </label>

            <input
                type="number"
                id="cantidad"
                name="cantidad"
                min="1"
                required
            >

            <p class="ayuda">
                La cantidad será validada nuevamente por la API
                antes de crear el pedido.
            </p>

            <button type="submit">
                Crear pedido
            </button>
        </form>
    </div>
</body>
</html>
